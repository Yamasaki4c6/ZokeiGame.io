<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>部員紹介 | 東京造形大学ゲーム研究会</title>
  <meta name="description" content="東京造形大学ゲーム研究会の部員紹介です。">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header is-scrolled" id="top">
    <div class="site-header__inner">
      <a class="site-logo" href="index.html">
        <img src="assets/img/favicon.svg" alt="" width="28" height="28">
        <span>東京造形大学ゲーム研究会</span>
      </a>
      <nav class="site-nav" aria-label="メインメニュー" style="position:static;opacity:1;visibility:visible;background:none"><ul style="flex-direction:row;padding:0"><li style="border:0"><a href="index.html" style="padding:6px 0;font-size:.82rem">TOP</a></li></ul></nav>
    </div>
  </header>

  <main class="page" id="main">
    <div class="container">
      <h1 class="section__title" style="margin-bottom:56px">MEMBERS<span>部員紹介</span></h1>
      <ul class="member-grid" id="member-grid"></ul>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p class="site-footer__name">東京造形大学ゲーム研究会</p>
      <ul class="site-footer__links">
        <li><a data-link="xUrl" href="#" target="_blank" rel="noopener">公式X</a></li>
        <li><a data-link="joinFormUrl" href="#" target="_blank" rel="noopener">入部希望フォーム</a></li>
        <li><a data-link="termsUrl" href="#" target="_blank" rel="noopener">規約</a></li>
      </ul>
      <p class="site-footer__copy">&copy; Tokyo Zokei University Game Research Club</p>
    </div>
  </footer>
  <script src="js/site-config.js"></script>
  <script>
    document.querySelectorAll("[data-link]").forEach(function (a) {
      var v = (window.SITE_CONFIG || {})[a.getAttribute("data-link")];
      if (v) a.href = v;
    });
  </script>
  <script src="js/members.js"></script>
  <script>
    (function () {
      var list = document.getElementById("member-grid");
      function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
      (window.MEMBERS || []).forEach(function (m) {
        var li = el("li", "member");
        var ph = el("div", "member__photo");
        if (m.photo) { var img = el("img"); img.src = m.photo; img.alt = ""; img.loading = "lazy"; ph.appendChild(img); }
        else ph.textContent = String(m.name || "?").charAt(0).toUpperCase();
        li.appendChild(ph);
        li.appendChild(el("p", "member__role", m.role || ""));
        li.appendChild(el("h2", "member__name", m.name));
        if (m.part) li.appendChild(el("p", "member__part", m.part));
        if (m.works && m.works.length) {
          var ul = el("ul", "member__works");
          m.works.forEach(function (w) { ul.appendChild(el("li", null, w)); });
          li.appendChild(ul);
        }
        if (m.x) { var a = el("a", "member__x", "X"); a.href = m.x; a.target = "_blank"; a.rel = "noopener"; li.appendChild(a); }
        list.appendChild(li);
      });
    })();
  </script>
</body>
</html>
