<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公式ページ準備中 | 東京造形大学ゲーム研究会</title>
  <meta name="description" content="作品の公式ページは現在準備中です。">
  <meta name="theme-color" content="#120e2b">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header is-scrolled" id="top">
    <div class="site-header__inner">
      <a class="site-logo" href="../index.html">
        <img src="../assets/img/favicon.svg" alt="" width="28" height="28">
        <span>造形大ゲーム研究会</span>
      </a>
      <nav aria-label="メインメニュー"><a class="back-link" style="margin:0" href="../index.html">← トップへ</a></nav>
    </div>
  </header>

  <main class="page coming-soon" id="main">
    <div class="container">
      <img id="cs-img" src="../assets/img/games/placeholder-1.svg" alt="">
      <p class="game-card__meta" id="cs-meta"></p>
      <h1 id="cs-title">公式ページ準備中</h1>
      <p id="cs-desc">この作品の公式ページは現在準備中です。公開まで少々お待ちください。</p>
      <p>最新情報は公式Xでお知らせします。</p>
      <a class="btn btn--primary" data-link="xUrl" href="#" target="_blank" rel="noopener">公式Xを見る</a><br>
      <a class="back-link" href="../index.html#games">← 作品一覧へ戻る</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p class="site-footer__name">東京造形大学ゲーム研究会</p>
      <ul class="site-footer__links">
        <li><a data-link="xUrl" href="#" target="_blank" rel="noopener">公式X</a></li>
        <li><a data-link="joinFormUrl" href="#" target="_blank" rel="noopener">入部希望フォーム</a></li>
        <li><a href="../terms.html">規約</a></li>
      </ul>
      <p class="site-footer__copy">&copy; 東京造形大学ゲーム研究会</p>
    </div>
  </footer>
  <script src="../js/site-config.js"></script>
  <script>
    document.querySelectorAll("[data-link]").forEach(function (a) {
      var v = (window.SITE_CONFIG || {})[a.getAttribute("data-link")];
      if (v) a.href = v;
    });
  </script>
  <script src="../js/games.js"></script>
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get("id");
      var g = (window.GAMES || []).filter(function (x) { return x.id === id; })[0];
      if (!g) return;
      document.title = g.title + "(準備中)| 東京造形大学ゲーム研究会";
      document.getElementById("cs-img").src = "../" + g.thumbnail;
      document.getElementById("cs-meta").textContent = [g.genre, g.year, g.platform].filter(Boolean).join(" / ");
      document.getElementById("cs-title").textContent = g.title;
      document.getElementById("cs-desc").textContent = g.description;
    })();
  </script>
</body>
</html>
